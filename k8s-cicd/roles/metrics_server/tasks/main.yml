---
# metrics-server: cần cho "kubectl top" và HorizontalPodAutoscaler
- name: Tải manifest metrics-server {{ metrics_server_version }}
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml"
    dest: /root/cicd/metrics-server.yaml
    mode: "0600"

# kubelet của kubeadm dùng cert tự ký -> metrics-server cần bỏ qua kiểm tra TLS
- name: Thêm --kubelet-insecure-tls
  ansible.builtin.lineinfile:
    path: /root/cicd/metrics-server.yaml
    insertafter: '^\s+- --secure-port='
    line: "        - --kubelet-insecure-tls"
    regexp: '--kubelet-insecure-tls'

- name: Cài metrics-server
  ansible.builtin.command: kubectl apply -f /root/cicd/metrics-server.yaml
  register: metrics_apply
  changed_when: "'created' in metrics_apply.stdout or 'configured' in metrics_apply.stdout"
