---
# csi-driver-nfs: driver NFS chính thức của Kubernetes SIG Storage
- name: Cài csi-driver-nfs {{ csi_nfs_chart_version }}
  ansible.builtin.command: >-
    helm upgrade --install csi-driver-nfs csi-driver-nfs/csi-driver-nfs
    --namespace kube-system
    --version {{ csi_nfs_chart_version }}
    --wait --timeout 10m
  changed_when: true

- name: Tạo StorageClass {{ nfs_storageclass }}
  ansible.builtin.template:
    src: nfs-storageclass.yaml.j2
    dest: /root/cicd/nfs-storageclass.yaml
    mode: "0600"

# Tham số StorageClass không sửa được sau khi tạo -> đổi server/share thì phải xóa đi tạo lại
- name: Áp dụng StorageClass
  ansible.builtin.shell: |
    set -o pipefail
    kubectl apply -f /root/cicd/nfs-storageclass.yaml 2>&1 || {
      kubectl delete storageclass {{ nfs_storageclass }} && kubectl apply -f /root/cicd/nfs-storageclass.yaml
    }
  args:
    executable: /bin/bash
  register: nfs_storage_sc
  changed_when: "'created' in nfs_storage_sc.stdout or 'configured' in nfs_storage_sc.stdout"

# ---------- Thử ghi/đọc thật lên NFS ----------
- name: Xóa bài thử cũ (nếu có)
  ansible.builtin.command: kubectl -n default delete pod,pvc nfs-test --ignore-not-found --wait=true
  changed_when: false

- name: Tạo PVC + pod thử
  ansible.builtin.template:
    src: nfs-test.yaml.j2
    dest: /root/cicd/nfs-test.yaml
    mode: "0600"

- name: Chạy pod thử ghi file lên NFS
  ansible.builtin.command: kubectl apply -f /root/cicd/nfs-test.yaml
  changed_when: false

- name: Chờ pod thử chạy xong
  ansible.builtin.command: kubectl -n default get pod nfs-test -o jsonpath='{.status.phase}'
  register: nfs_storage_test
  until: nfs_storage_test.stdout in ['Succeeded', 'Failed']
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false

- name: Lấy thông tin lỗi (nếu có)
  ansible.builtin.shell: |
    kubectl -n default describe pvc nfs-test | tail -5
    kubectl -n default describe pod nfs-test | tail -8
  register: nfs_storage_debug
  changed_when: false
  when: nfs_storage_test.stdout != 'Succeeded'

- name: Kết quả thử NFS
  ansible.builtin.assert:
    that: nfs_storage_test.stdout == 'Succeeded'
    success_msg: "K8s ghi/đọc được NFS {{ nfs_server }}:{{ nfs_share }}"
    fail_msg: >-
      K8s KHÔNG ghi được lên NFS {{ nfs_server }}:{{ nfs_share }}
      (kiểm tra project data-server đã chạy --tags nfs, IP node có trong nfs_allowed_clients).
      {{ nfs_storage_debug.stdout | default('') }}

# PVC thử dùng Retain -> xóa PV và thư mục thử trên NFS bằng tay nếu muốn (default-nfs-test)
- name: Dọn bài thử
  ansible.builtin.shell: |
    PV=$(kubectl -n default get pvc nfs-test -o jsonpath='{.spec.volumeName}')
    kubectl -n default delete pod,pvc nfs-test --wait=true
    [ -n "$PV" ] && kubectl delete pv "$PV" --wait=false || true
  args:
    executable: /bin/bash
  changed_when: false
