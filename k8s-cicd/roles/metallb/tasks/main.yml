---
- name: Cài MetalLB {{ metallb_version }}
  ansible.builtin.command: >-
    kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
  register: metallb_apply
  changed_when: "'created' in metallb_apply.stdout or 'configured' in metallb_apply.stdout"

- name: Chờ MetalLB controller sẵn sàng
  ansible.builtin.command: kubectl -n metallb-system rollout status deploy/controller --timeout=300s
  changed_when: false

- name: Chờ MetalLB speaker sẵn sàng
  ansible.builtin.command: kubectl -n metallb-system rollout status ds/speaker --timeout=300s
  changed_when: false

- name: Tạo file cấu hình dải IP
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: /root/cicd/metallb-pool.yaml
    mode: "0600"

# Webhook của MetalLB cần vài giây sau khi pod Ready mới nhận request
- name: Áp dụng IPAddressPool + L2Advertisement
  ansible.builtin.command: kubectl apply -f /root/cicd/metallb-pool.yaml
  register: metallb_pool
  until: metallb_pool.rc == 0
  retries: 12
  delay: 10
  changed_when: "'created' in metallb_pool.stdout or 'configured' in metallb_pool.stdout"
