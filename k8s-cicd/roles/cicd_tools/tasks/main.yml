---
- name: Kiểm tra helm đã cài chưa
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: cicd_tools_helm

- name: Cài Helm 3
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    executable: /bin/bash
  when: not cicd_tools_helm.stat.exists
  changed_when: true

- name: Thêm Helm repo
  ansible.builtin.command: helm repo add {{ item.name }} {{ item.url }} --force-update
  loop:
    - { name: traefik, url: "https://traefik.github.io/charts" }
    - { name: argo, url: "https://argoproj.github.io/argo-helm" }
    - { name: jenkins, url: "https://charts.jenkins.io" }
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: csi-driver-nfs, url: "https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts" }
  changed_when: false

- name: Cập nhật Helm repo
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Tạo các namespace
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  loop: [traefik, argocd, jenkins, wordpress]
  register: cicd_tools_ns
  changed_when: "'created' in cicd_tools_ns.stdout"
