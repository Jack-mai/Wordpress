---
- name: Secret tài khoản admin Jenkins
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n jenkins create secret generic jenkins-admin \
      --from-literal=jenkins-admin-user=admin \
      --from-literal=jenkins-admin-password='{{ jenkins_admin_password }}' \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false

- name: Secret GitHub cho JCasC
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n jenkins create secret generic jenkins-ci-secrets \
      --from-literal=github-username={{ github_user }} \
      --from-literal=github-token={{ github_token }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false

# BuildKit trong pod agent dùng secret này để push image lên GHCR
- name: Secret đăng nhập GHCR (push)
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n jenkins create secret docker-registry ghcr-push \
      --docker-server=ghcr.io \
      --docker-username={{ github_user }} \
      --docker-password={{ github_token }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false

- name: Tạo values Jenkins
  ansible.builtin.template:
    src: jenkins-values.yaml.j2
    dest: /root/cicd/jenkins-values.yaml
    mode: "0600"

# Lần đầu Jenkins tải plugin từ Internet nên khá lâu (5-15 phút)
- name: Gỡ bản cài jenkins bị lỗi lần trước (nếu có)
  ansible.builtin.shell: |
    set -o pipefail
    if helm list -n jenkins --failed --pending -q | grep -qx jenkins; then
      helm uninstall jenkins -n jenkins --wait && echo REMOVED
    fi
  args:
    executable: /bin/bash
  register: helm_cleanup_jenkins
  changed_when: "'REMOVED' in helm_cleanup_jenkins.stdout"

- name: Cài Jenkins
  ansible.builtin.command: >-
    helm upgrade --install jenkins jenkins/jenkins
    --namespace jenkins
    --version {{ jenkins_chart_version }}
    -f /root/cicd/jenkins-values.yaml
    --wait --timeout 20m
  changed_when: true

- name: Tạo Ingress Jenkins ({{ jenkins_path }})
  ansible.builtin.template:
    src: jenkins-ingress.yaml.j2
    dest: /root/cicd/jenkins-ingress.yaml
    mode: "0600"

- name: Áp dụng Ingress Jenkins
  ansible.builtin.command: kubectl apply -f /root/cicd/jenkins-ingress.yaml
  register: jenkins_ingress
  changed_when: "'created' in jenkins_ingress.stdout or 'configured' in jenkins_ingress.stdout"
