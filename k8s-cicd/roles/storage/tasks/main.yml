---
# local-path-provisioner: tự tạo PersistentVolume trên ổ đĩa của node (/opt/local-path-provisioner)
# Đơn giản, đủ cho lab/dịch vụ 1 replica. Cần HA storage thì thay bằng Longhorn / NFS / Ceph.
- name: Cài local-path-provisioner {{ local_path_version }}
  ansible.builtin.command: >-
    kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml
  register: storage_apply
  changed_when: "'created' in storage_apply.stdout or 'configured' in storage_apply.stdout"

- name: Đặt local-path làm StorageClass mặc định
  ansible.builtin.command: >-
    kubectl patch storageclass local-path -p
    '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  changed_when: false

- name: Chờ local-path-provisioner sẵn sàng
  ansible.builtin.command: kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=180s
  changed_when: false
