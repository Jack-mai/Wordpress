---
# ====================== CẤU HÌNH CI/CD ======================

# ---- MetalLB: dải IP cấp cho Service type LoadBalancer ----
# PHẢI là các IP còn trống trong 10.10.90.0/24 (không trùng node, VIP .150, máy .140, máy MySQL .149)
metallb_ip_range: "10.10.90.151-10.10.90.159"
# IP cố định cho Traefik (cửa vào duy nhất cho mọi web: Jenkins, Argo CD, WordPress)
ingress_ip: "10.10.90.151"

# ---- Truy cập: 1 IP, phân theo đường dẫn, HTTPS bằng CA nội bộ ----
#   https://10.10.90.151           -> WordPress
#   https://10.10.90.151/argocd    -> Argo CD
#   https://10.10.90.151/jenkins   -> Jenkins
# http:// tự chuyển sang https://. Chứng chỉ do CA nội bộ (cert-manager) cấp cho IP ingress_ip;
# file CA lưu ở k8s-cicd/internal-ca.crt sau khi chạy -> cài vào máy client để hết cảnh báo.
public_url: "https://{{ ingress_ip }}"
argocd_path: "/argocd"
jenkins_path: "/jenkins"
tls_secret_name: "ingress-tls"
# Có tên miền nội bộ thì thêm vào đây để chứng chỉ hợp lệ cho cả tên miền (vd ["k8s.congty.local"])
tls_extra_dns_names: []

# ---- GitHub ----
github_user: "Jack-mai"

# Repo này (Ansible + Helm chart WordPress). Argo CD đọc Helm chart ở gitops_path
gitops_repo_url: "https://github.com/{{ github_user }}/Wordpress.git"
gitops_repo_branch: "main"
gitops_path: "gitops/wordpress"
gitops_values_file: "values-prod.yaml"

# Phần B (CI/CD): repo code WordPress (Dockerfile + Jenkinsfile), Jenkins build từ đây
app_repo_url: "https://github.com/{{ github_user }}/wordpress-app.git"
app_repo_branch: "main"
# Image trên GHCR (tên phải viết thường)
app_image: "ghcr.io/{{ github_user | lower }}/wordpress-app"

# ---- Database cho WordPress (MySQL trên máy dữ liệu, project data-server) ----
# Đổi DB chỉ cần sửa ở đây rồi chạy: ansible-playbook cicd.yml --tags wordpress
wordpress_db_host: "10.10.90.149"
wordpress_db_port: 3306
wordpress_db_name: "wordpress"
wordpress_db_user: "wordpress"
# Mật khẩu: wordpress_db_password trong vars/secrets.yml

# ---- File share NFS (máy dữ liệu, project data-server) ----
# WordPress lưu uploads lên NFS -> chạy được nhiều replica (ReadWriteMany)
nfs_server: "10.10.90.149"
nfs_share: "/srv/nfs/k8s"
nfs_storageclass: "nfs-csi"

# ---- Phiên bản (đã kiểm tra 10/2026) ----
local_path_version: "v0.0.36"
metallb_version: "v0.15.3"
metrics_server_version: "v0.8.1"
# Helm chart: để "" = bản mới nhất
traefik_chart_version: ""
argocd_chart_version: "10.10.5"
jenkins_chart_version: "5.9.70"
csi_nfs_chart_version: "4.13.5"
cert_manager_version: "v1.20.2"

# ---- Dung lượng ----
jenkins_pvc_size: "20Gi"
