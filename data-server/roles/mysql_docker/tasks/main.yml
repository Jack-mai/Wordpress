---
- name: Kiểm tra hệ điều hành Ubuntu
  ansible.builtin.assert:
    that: ansible_distribution == "Ubuntu"
    fail_msg: "Role này viết cho Ubuntu"

- name: Đặt hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# ---------------- Docker ----------------
- name: Chờ apt/dpkg rảnh (máy mới bật hay chạy unattended-upgrades)
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false
  timeout: 900

- name: Gỡ gói docker cũ của Ubuntu (nếu có)
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-compose-v2, podman-docker]
    state: absent
    lock_timeout: 600

- name: Thêm repo Docker chính thức
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Cài Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    lock_timeout: 600

- name: Giới hạn dung lượng log container
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" }
      }
  notify: restart docker

- name: Bật Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Áp dụng cấu hình Docker
  ansible.builtin.meta: flush_handlers

# ---------------- MySQL ----------------
- name: Tạo thư mục MySQL
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ mysql_dir }}", mode: "0750" }
    - { path: "{{ mysql_dir }}/conf.d", mode: "0755" }
    - { path: "{{ mysql_dir }}/backup", mode: "0700" }

- name: File mật khẩu (.env)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mysql_dir }}/.env"
    mode: "0600"
  no_log: true
  register: mysql_docker_env

- name: Cấu hình MySQL (my.cnf)
  ansible.builtin.template:
    src: my.cnf.j2
    dest: "{{ mysql_dir }}/conf.d/custom.cnf"
    mode: "0644"
  register: mysql_docker_cnf

- name: File compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ mysql_dir }}/compose.yml"
    mode: "0644"
  register: mysql_docker_compose

- name: Khởi động MySQL (docker compose up -d)
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ mysql_dir }}"
  register: mysql_docker_up
  changed_when: "'Started' in mysql_docker_up.stderr or 'Recreated' in mysql_docker_up.stderr or 'Created' in mysql_docker_up.stderr"

- name: Restart MySQL khi đổi my.cnf
  ansible.builtin.command: docker compose restart mysql
  args:
    chdir: "{{ mysql_dir }}"
  when: mysql_docker_cnf is changed and mysql_docker_up is not changed
  changed_when: true

- name: Chờ MySQL healthy (lần đầu khởi tạo mất 30-60 giây)
  ansible.builtin.command: docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' mysql
  register: mysql_docker_health
  until: mysql_docker_health.stdout == "healthy"
  retries: 30
  delay: 5
  changed_when: false

# Chạy mỗi lần -> đổi mật khẩu trong secrets.yml rồi chạy lại là cập nhật được
- name: Tạo database + user cho từng ứng dụng
  ansible.builtin.shell: |
    docker exec -i -e MYSQL_PWD mysql mysql -uroot <<'SQL'
    CREATE DATABASE IF NOT EXISTS `{{ item.name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS '{{ item.user }}'@'{{ item.allowed_host }}' IDENTIFIED BY '{{ lookup('vars', item.password_var) }}';
    ALTER USER '{{ item.user }}'@'{{ item.allowed_host }}' IDENTIFIED BY '{{ lookup('vars', item.password_var) }}';
    GRANT ALL PRIVILEGES ON `{{ item.name }}`.* TO '{{ item.user }}'@'{{ item.allowed_host }}';
    FLUSH PRIVILEGES;
    SQL
  args:
    executable: /bin/bash
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"
  loop: "{{ mysql_apps }}"
  loop_control:
    label: "{{ item.user }}@{{ item.allowed_host }} -> {{ item.name }}"
  no_log: true
  changed_when: false

- name: Danh sách user đã cấp quyền
  ansible.builtin.shell: |
    docker exec -e MYSQL_PWD mysql mysql -uroot -N -e \
      "SELECT CONCAT(user,'@',host) FROM mysql.user WHERE user NOT IN ('root','mysql.sys','mysql.session','mysql.infoschema');"
  args:
    executable: /bin/bash
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"
  register: mysql_docker_users
  changed_when: false

# ---------------- Backup ----------------
- name: Script backup
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/mysql-backup.sh
    mode: "0700"

- name: Lịch backup hằng ngày
  ansible.builtin.cron:
    name: mysql-backup
    user: root
    hour: "{{ mysql_backup_hour }}"
    minute: "{{ mysql_backup_minute }}"
    job: "/usr/local/bin/mysql-backup.sh >> /var/log/mysql-backup.log 2>&1"

- name: Kết quả
  ansible.builtin.debug:
    msg:
      - "MySQL chạy tại {{ ansible_host }}:{{ mysql_port }}"
      - "User ứng dụng: {{ mysql_docker_users.stdout_lines | join(', ') }}"
      - "Dữ liệu: {{ mysql_dir }}/data  |  Backup: {{ mysql_dir }}/backup (hằng ngày {{ mysql_backup_hour }}:{{ mysql_backup_minute }})"
