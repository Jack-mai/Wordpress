---
- name: Chờ apt/dpkg rảnh
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false
  timeout: 900

- name: Cài NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
    lock_timeout: 600

- name: Tạo thư mục chia sẻ {{ nfs_export_dir }}
  ansible.builtin.file:
    path: "{{ nfs_export_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Số luồng NFS
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: threads
    value: "{{ nfs_threads }}"
    mode: "0644"
  notify: restart nfs

- name: Cấu hình /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: "0644"
  notify: reload exports

- name: Bật NFS server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    enabled: true
    state: started

- name: Áp dụng cấu hình NFS
  ansible.builtin.meta: flush_handlers

- name: Kiểm tra thư mục đã được chia sẻ
  ansible.builtin.command: exportfs -v
  register: nfs_server_exports
  changed_when: false
  failed_when: nfs_export_dir not in nfs_server_exports.stdout

# ---------------- Backup ----------------
- name: Thư mục backup file share
  ansible.builtin.file:
    path: "{{ nfs_backup_dir }}"
    state: directory
    mode: "0700"

- name: Script backup file share
  ansible.builtin.template:
    src: nfs-backup.sh.j2
    dest: /usr/local/bin/nfs-backup.sh
    mode: "0700"

- name: Lịch backup file share hằng đêm
  ansible.builtin.cron:
    name: nfs-backup
    user: root
    hour: "{{ nfs_backup_hour }}"
    minute: "{{ nfs_backup_minute }}"
    job: "/usr/local/bin/nfs-backup.sh >> /var/log/nfs-backup.log 2>&1"

- name: Kết quả NFS
  ansible.builtin.debug:
    msg:
      - "NFS: {{ ansible_host }}:{{ nfs_export_dir }} (cho phép: {{ nfs_allowed_clients | join(', ') }})"
      - "Backup: {{ nfs_backup_dir }} (hằng ngày {{ nfs_backup_hour }}:{{ '%02d' | format(nfs_backup_minute | int) }}, giữ {{ nfs_backup_keep_days }} ngày)"
