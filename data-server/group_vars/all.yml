---
# ====================== MYSQL (Docker Compose) ======================
mysql_image: "mysql:8.4"            # 8.4 = bản LTS
mysql_dir: /opt/mysql               # chứa compose.yml, .env, data, backup
mysql_port: 3306

# Tuning theo RAM: ~50-70% RAM nếu máy chỉ chạy MySQL (VM 4GB -> 2G)
mysql_innodb_buffer_pool_size: "1G"
mysql_max_connections: 300

# ---- Database + user cho từng ứng dụng ----
# Thêm ứng dụng mới: thêm 1 mục vào đây + mật khẩu tương ứng trong vars/secrets.yml
# allowed_host: IP/dải được phép kết nối (pod K8s đi ra bằng IP của node 10.10.90.141-146)
mysql_apps:
  - name: wordpress           # tên database
    user: wordpress
    password_var: mysql_wordpress_password
    allowed_host: "10.10.90.%"

# ---- Backup mysqldump hằng ngày ----
mysql_backup_hour: "1"
mysql_backup_minute: "30"
mysql_backup_keep_days: 7

# ====================== NFS FILE SHARE ======================
# Thư mục gốc chia sẻ cho K8s. csi-driver-nfs tự tạo thư mục con cho mỗi PVC
# (vd /srv/nfs/k8s/pvc-xxxx = uploads của WordPress)
nfs_export_dir: /srv/nfs/k8s
# Chỉ các node K8s được mount (master + worker)
nfs_allowed_clients:
  - 10.10.90.141
  - 10.10.90.142
  - 10.10.90.143
  - 10.10.90.144
  - 10.10.90.145
  - 10.10.90.146
# no_root_squash: container WordPress cần chown thư mục uploads (giới hạn bằng danh sách IP ở trên)
nfs_export_options: "rw,sync,no_subtree_check,no_root_squash"
nfs_threads: 16

# Backup file share: nén toàn bộ nfs_export_dir hằng đêm
nfs_backup_dir: /opt/backup/nfs
nfs_backup_hour: "2"
nfs_backup_minute: "0"
nfs_backup_keep_days: 7
