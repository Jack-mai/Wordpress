# Máy dữ liệu: MySQL (Docker Compose) + NFS file share (Ubuntu 22.04/24.04)
[dataserver]
data-server ansible_host=10.10.90.149

[dataserver:vars]
# User SSH (có quyền sudo)
ansible_user=administrator
# SSH key dùng chung với project k8s-ansible
ansible_ssh_private_key_file=~/.ssh/id_rsa_ansible
